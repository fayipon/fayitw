<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clay 農場 — 田園小日子</title>
<meta name="theme-color" content="#e9e4cc">
<link rel="preload" as="image" href="assets/backgrounds/clay-loading-garden.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/ui/clay-farm/logo.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/ui/clay-farm/crop-icons.webp">
<link rel="stylesheet" href="css/clay-farm.css">
<link rel="stylesheet" href="css/clay-loading.css">
<link rel="stylesheet" href="css/clay-debug.css">
<script type="importmap">{"imports":{"three":"./js/vendor/three/three.module.js","three/addons/":"./js/vendor/three/addons/"}}</script>
</head>
<body>
<main id="farm" aria-label="Clay 農場 3D 場景" aria-busy="true">
<div id="farm-scene" inert aria-hidden="true">
<header class="farm-header"><a class="back" href="index.html" aria-label="回到首頁">←</a><div><p> A LITTLE WORLD OF CLAY </p><h1>Clay 農場<span>田園小日子</span></h1></div><div class="weather"><span>☀</span><div>晴朗的午後<small>適合慢慢生活的一天</small></div></div></header>
<div id="viewport"></div>
<div class="scene-label"><span></span> 我的小小農場 <i>01 / 田園</i></div>
<p id="notice" role="status" hidden></p>
<section id="plot-actions" class="plot-actions" aria-labelledby="plot-action-title" hidden>
 <header class="plot-action-heading"><div><strong id="plot-action-title">田格 A1</strong><span id="plot-soil-state"></span></div><button id="plot-action-close" aria-label="關閉農田操作">×</button></header>
 <p id="plot-action-status" role="status" aria-live="polite"></p>
 <div id="plot-planting" class="plot-planting" role="group" aria-label="選擇要種植的作物"></div>
 <div id="crop-status" class="crop-status" hidden>
  <div class="crop-status-overview">
   <div class="crop-status-portrait"><span id="crop-status-icon" class="crop-choice-icon" aria-hidden="true"></span></div>
   <div class="crop-status-summary">
    <small id="crop-status-plot"></small><h2 id="crop-status-name"></h2>
    <span id="crop-status-badge" class="crop-status-badge"></span>
    <div class="crop-status-progress-row"><progress id="crop-status-progress" max="3" value="1" aria-label="作物成長階段"></progress><strong id="crop-status-step"></strong></div>
   </div>
  </div>
  <div class="crop-status-facts">
   <div class="crop-status-fact crop-status-moisture"><span class="crop-fact-icon" aria-hidden="true">💧</span><div><strong id="crop-status-water"></strong><small id="crop-status-moisture"></small></div></div>
   <div class="crop-status-fact"><span id="crop-status-ready-icon" class="crop-fact-icon" aria-hidden="true">🕒</span><div><strong id="crop-status-ready"></strong><small id="crop-status-care"></small></div></div>
   <div class="crop-status-fact"><span class="crop-fact-icon" aria-hidden="true">🌱</span><div><strong id="crop-status-stage"></strong><small id="crop-status-stage-label"></small></div></div>
  </div>
 </div>
 <button id="plot-retry" hidden>重新載入作物</button>
</section>
<button id="debug-toggle" class="farm-debug-toggle" aria-expanded="false" aria-controls="debug-panel">DEBUG</button>
<section id="debug-panel" class="farm-debug-panel" aria-labelledby="debug-title" hidden>
 <header class="debug-heading"><div><span>FARM TOOLS</span><h2 id="debug-title">作物實驗室</h2></div><button id="debug-close" aria-label="關閉 DEBUG 工具">×</button></header>
 <p class="debug-hint">點選田地，或選擇下方田格。</p>
 <label class="debug-plot-picker" for="debug-plot">田格<select id="debug-plot" aria-label="指定種植田格"></select></label>
 <label class="debug-plot-picker debug-crop-picker" for="debug-crop">作物<select id="debug-crop" aria-label="選擇作物"></select></label>
 <div class="debug-state-row"><span>生長狀態</span><strong id="debug-state">尚未種植</strong></div>
 <div class="debug-state-row"><span>已收穫</span><strong id="debug-harvest-count"></strong></div>
 <div class="debug-state-row"><span>土壤狀態</span><strong id="debug-soil-state"></strong></div>
 <div class="debug-soil-controls" role="group" aria-label="調整所選田格的土壤狀態"><button type="button" data-debug-soil="wet" aria-pressed="false">濕潤</button><button type="button" data-debug-soil="dry" aria-pressed="false">乾枯</button></div>
 <ol class="debug-stages" aria-label="作物生長階段"><li data-crop-stage="0">幼苗</li><li data-crop-stage="1">成長</li><li data-crop-stage="2">成熟</li></ol>
 <div class="debug-actions"><button id="debug-plant" disabled>種下小麥</button><button id="debug-grow" disabled>催熟一階</button></div>
 <button id="debug-water" class="debug-water" hidden>澆水</button>
 <button id="debug-harvest" class="debug-harvest" hidden>收穫</button>
 <button id="debug-clear" class="debug-clear" disabled>清除這一格</button>
 <p id="debug-message" role="status" aria-live="polite">選擇作物，在指定田格種植。</p>
 <button id="debug-retry" hidden>重新載入模型</button>
</section>
</div>
<section id="loading" aria-labelledby="loading-title">
 <div class="loading-composition">
  <img class="loading-art" src="assets/backgrounds/clay-loading-garden.webp" width="941" height="1672" alt="" fetchpriority="high" decoding="async">
 </div>
 <div class="loading-brand">
  <img class="loading-logo" src="assets/ui/clay-farm/logo.webp" width="768" height="512" alt="Clay Farm" fetchpriority="high" decoding="async">
 </div>
 <div class="loading-meter">
  <div class="loading-meter-label" aria-hidden="true">
   <span id="loading-stage">正在準備田園小日子…</span>
   <span id="loading-percent">0%</span>
  </div>
  <div class="loading-track">
   <progress id="loading-progress" max="100" value="0" aria-label="農場載入進度"></progress>
  </div>
  <p class="loading-footer" aria-hidden="true">PLANT · WATER · HARVEST · SMILE</p>
 </div>
 <div class="loading-message">
  <h1 id="loading-title">Clay Farm — 田園小日子</h1>
  <p id="loading-status" role="status" aria-live="polite">正在準備田園小日子…</p>
  <button id="loading-retry" hidden>重新載入</button>
  <a class="loading-back" href="index.html">← 返回首頁</a>
 </div>
 <noscript>請開啟 JavaScript，讓小農場動起來。</noscript>
</section>
</main>
<script type="module">
import { createFarmLoading } from './js/clay-loading.js';
import('./js/clay-farm.js').catch(error=>{
 console.error(error);
 if(!document.querySelector('#loading').classList.contains('has-error')){
  createFarmLoading().fail('載入暫時中斷了，請重新載入小農場。');
 }
});
</script>
</body></html>
