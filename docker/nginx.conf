server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/wasm application/octet-stream;

    # HTML 不快取，改版後馬上看得到
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # CSS / JS 的網址在建置時加上內容雜湊，這裡的快取時間只影響沒帶版本號的請求
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff";
    }

    # HG-Fable01 -小紅帽 的 Godot 匯出檔（index.wasm／index.pck 檔名固定）：每次都跟伺服器確認，
    # 改版後不會拿到舊的 pck 配新的引擎；沒改的檔案回 304，不會重新下載
    location ^~ /assets/auto-slot/game/ {
        types {
            text/html html;
            application/javascript js;
            application/wasm wasm;
            application/octet-stream pck;
            image/png png;
        }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # 圖片與實機影片檔名固定，快取一天（影片跳段靠 nginx 預設的 Range 支援）
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header X-Content-Type-Options "nosniff";
    }
}
